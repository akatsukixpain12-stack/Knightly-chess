name: Deploy Knightly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: knightly-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Bun for the Stockfish GUI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prepare Stockfish 19 GUI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stockfish-gui/assets/books stockfish-gui/public/engine
          curl -fL --retry 3 https://raw.githubusercontent.com/LabinatorSolutions/stockfish-chess-web-gui/master/assets/books/openings.bin -o stockfish-gui/assets/books/openings.bin
          curl -fL --retry 3 https://raw.githubusercontent.com/LabinatorSolutions/stockfish-chess-web-gui/master/public/engine/stockfish-19-lite.wasm -o stockfish-gui/public/engine/stockfish-19-lite.wasm
          curl -fL --retry 3 https://raw.githubusercontent.com/LabinatorSolutions/stockfish-chess-web-gui/master/public/favicon.png -o stockfish-gui/public/favicon.png
          curl -fL --retry 3 https://raw.githubusercontent.com/LabinatorSolutions/stockfish-chess-web-gui/master/public/icon-192.png -o stockfish-gui/public/icon-192.png
          curl -fL --retry 3 https://raw.githubusercontent.com/LabinatorSolutions/stockfish-chess-web-gui/master/public/icon-512.png -o stockfish-gui/public/icon-512.png
          cd stockfish-gui
          bun install
          bun run build
          cd ..
          mkdir -p public/stockfish-gui
          cp -a stockfish-gui/dist/. public/stockfish-gui/

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Knightly-chess

      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
